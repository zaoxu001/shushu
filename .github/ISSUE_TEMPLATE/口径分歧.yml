name: 口径分歧
description: 某一条规则算得不对，或者你那一派的算法与这里不同
labels: ["口径"]
body:
  - type: markdown
    attributes:
      value: |
        术数各派口径不同，同一张命盘得出不同结论是常见情形，未必存在对错之分。
        本模板需要的是**可核对的依据**：说明所依流派的算法及其出处。
        经核对成立的分歧，将调整默认口径，或作为可选口径与现有实现并存。
  - type: input
    id: where
    attributes:
      label: 分歧所在
      placeholder: 例如 shushu.bazi.yongshen.select，或者「未月的藏干次序」
    validations: { required: true }
  - type: textarea
    id: case
    attributes:
      label: 可复现的实例
      description: 四柱、性别，本项目的输出，以及你认为正确的输出
      placeholder: |
        四柱：丙子 壬辰 乙酉 癸未，女
        这里算出：用土喜火
        应当是：用火喜木
      render: text
    validations: { required: true }
  - type: textarea
    id: source
    attributes:
      label: 依据
      description: 典籍名、卷次、原文；或某一派的成文口诀。没有出处的判断无法核对，也就无法合入。
      placeholder: |
        《穷通宝鉴》乙木·辰月：…（原文）
        或：某派口诀「…」，见《…》第…页
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: 适用范围
      description: 该规则的成立范围与已知例外。明确边界有助于判断应调整默认口径还是增加可选项。
