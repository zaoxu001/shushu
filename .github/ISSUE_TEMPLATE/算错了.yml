name: 算错了
description: 程序报错、崩溃，或结果明显不对（不是口径之争）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        如果是「你那一派算法不同」，请用「口径分歧」那个模板。
        这里收的是硬错误：报错、崩溃、或者结果自相矛盾（比如藏干表与司令分日对不上）。
  - type: textarea
    id: repro
    attributes:
      label: 怎么复现
      description: 贴一段能直接跑的代码
      render: python
      placeholder: |
        from shushu.bazi import build_chart
        c = build_chart(datetime(1996, 4, 18, 13, 46), longitude=116.4)
        print(c.quad)
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      description: 有报错就把完整 traceback 贴上
      render: text
    validations: { required: true }
  - type: input
    id: expected
    attributes:
      label: 预期输出
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: 版本与环境
      placeholder: shushu 0.1.0，Python 3.12，macOS
