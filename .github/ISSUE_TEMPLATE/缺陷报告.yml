name: 缺陷报告
description: 程序报错、崩溃，或结果存在客观错误（非口径分歧）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        若属于「所依流派算法不同」，请使用「口径分歧」模板。
        本模板用于客观错误：程序报错、崩溃，或结果自相矛盾（例如藏干表与人元司令分日不一致）。
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 提供一段可直接运行的代码
      render: python
      placeholder: |
        from shushu.bazi import build_chart
        c = build_chart(datetime(1996, 4, 18, 13, 46), longitude=116.4)
        print(c.quad)
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      description: 如有报错，请附完整 traceback
      render: text
    validations: { required: true }
  - type: input
    id: expected
    attributes:
      label: 预期输出
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: 版本与环境
      placeholder: shushu 0.1.0，Python 3.12，macOS
